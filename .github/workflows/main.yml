name: Test, build and deploy
on: [push]
jobs:

  generate-files:
    runs-on: ubuntu-latest
    container:
      image: centos:8
      volumes: 
        - ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@master
        
      - shell: bash  
        run: |
          dnf install openssl python3 -y
          python3 ciphers2json.py
          python3 create-script-include.py 

      - name: Upload generated cipher list
        uses: actions/upload-artifact@v1
        with:
          name: ciphers
          path: ciphers.json
      
      - name: Upload generated HTML-escaped script
        uses: actions/upload-artifact@v1
        with:
          name: script
          path: script.sh

  test-script:
    runs-on: ubuntu-latest
    container: centos:8
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - shell: bash
        run: |
          dnf install openssl python3 wget -y
          python3 test-testls.py
          chmod +x no-le-or-systemd-testls.sh
          ./no-le-or-systemd-testls.sh

  test-site:
    needs: generate-files
    runs-on: ubuntu-latest
    container: jekyll/builder:latest
    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Download cipher list
      uses: actions/download-artifact@v1
      with:
        name: ciphers

    - name: Download HTML-escaped script
      uses: actions/download-artifact@v1
      with:
        name: script
        
    - shell: bash
      run: |
        mkdir -p site/_data site/_includes site/.jekyll-cache
        mv ciphers/ciphers.json site/_data/ciphers.json
        mv script/script.sh site/_includes/
        cd site
        jekyll build --trace
 
  build-and-deploy:
    needs: [test-script, test-site, generate-files]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@master
      
    - name: Download cipher list
      uses: actions/download-artifact@v1
      with:
        name: ciphers

    - shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/site/_data/ ${{ github.workspace }}/site/_includes/
        mv ciphers/ciphers.json ${{ github.workspace }}/site/_data/
        mv script/script.sh ${{ github.workspace }}/site/_includes/

    - name: Build and Deploy
      uses: JamesIves/github-pages-deploy-action@master
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        BASE_BRANCH: master # The branch the action should deploy from.
        BRANCH: gh-pages # The branch the action should deploy to.
        FOLDER: site # The folder the action should deploy.
