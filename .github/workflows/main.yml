name: Build and Deploy
on: [push]
jobs:
  test-script:
    runs-on: ubuntu-latest
    container: centos:8
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - shell: bash
        run: |
          dnf install openssl python3 -y
          python3 test-testls.py
          chmod +x no-le-testls.sh
          ./no-le-testls.sh
    
  generate-ciphers:
    runs-on: ubuntu-latest
    container:
      image: centos:8
      volumes: 
        - ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@master
        
      - shell: bash  
        run: |
          dnf install openssl python3 -y
          python3 ciphers2json.py

      - name: Upload generated cipher list
        uses: actions/upload-artifact@v1
        with:
          name: ciphers
          path: ciphers.json
  build-and-deploy:
    needs: [test-script, generate-ciphers]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@master
      
    - name: Download cipher list
      uses: actions/download-artifact@v1
      with:
        name: ciphers

    - shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/site/_data/
        mkdir -p ${{ github.workspace }}/site/_includes/
        mv ciphers/ciphers.json ${{ github.workspace }}/site/_data/

    - name: Build and Deploy
      uses: JamesIves/github-pages-deploy-action@master
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        BASE_BRANCH: master # The branch the action should deploy from.
        BRANCH: gh-pages # The branch the action should deploy to.
        FOLDER: site # The folder the action should deploy.
        BUILD_SCRIPT: python create-script-include.py # The build script the action should run prior to deploying.
